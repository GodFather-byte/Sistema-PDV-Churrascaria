name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restaurar
        run: dotnet restore
      - name: Compilar
        run: dotnet build --no-restore -c Release
      - name: Testar
        run: dotnet test --no-build -c Release --verbosity normal
