name: Servidor de licenças

# Constrói a imagem Docker do painel/servidor de licenças e publica no GitHub Container Registry
# (ghcr.io/<dono>/licencas-pdv) a cada mudança na main que afete o servidor, ou manualmente.
on:
  push:
    branches: [main]
    paths: ['src/LicencasServidor/**', 'src/Licenciamento.Comum/**', '.github/workflows/servidor-licencas.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/licencas-pdv" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/LicencasServidor/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGEM }}:latest
            ${{ env.IMAGEM }}:${{ github.sha }}
